<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bumfodder</title>
<style>
  :root{
    --bg:#f6f5f1; --fg:#1d1d1b; --muted:#6b6a64; --card:#ffffff; --line:#dedcd3; --accent:#8a3b12;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161614; --fg:#ecebe5; --muted:#9a998f; --card:#1f1f1c; --line:#33322d; --accent:#e08a56; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  header{padding:1.5rem 1rem 0.5rem;max-width:1100px;margin:0 auto}
  h1{margin:0;font-size:1.8rem;letter-spacing:.02em}
  header p{margin:.25rem 0 0;color:var(--muted)}
  main{max-width:1100px;margin:0 auto;padding:1rem}
  .war{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:1.25rem 0;overflow:hidden}
  .war h2{margin:0;padding:.75rem 1rem;font-size:1.1rem;display:flex;justify-content:space-between;align-items:baseline;gap:1rem;border-bottom:1px solid var(--line)}
  .war h2 .tag{font-size:.8rem;font-weight:400;color:var(--muted)}
  .war.latest h2{color:var(--accent)}
  .shot{display:block;padding:1rem;text-align:center}
  .shot img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
  .caption{padding:0 1rem 1rem;text-align:center;color:var(--muted);font-size:.9rem}
  details{border-top:1px solid var(--line);padding:.6rem 1rem}
  summary{cursor:pointer;color:var(--accent)}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem;margin-top:.75rem}
  .thumbs a{color:var(--fg);text-decoration:none;font-size:.85rem;text-align:center}
  .thumbs img{width:100%;height:110px;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:#fff}
  #status{padding:2rem 1rem;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Bumfodder</h1>
  <p>Latest image from each war, newest war first.</p>
</header>
<main>
  <div id="status">Loading…</div>
  <div id="wars"></div>
</main>

<script>
/*
  How it works
  ------------
  GitHub Pages is static, so a page can't list folders by itself. This page asks the
  GitHub API for the repo's file tree, finds every  <war folder>/<name>.png , and
  shows the newest PNG for each war.

  "Newest" = highest day number in the filename (e.g. ...-day-494.png), falling back
  to the last name alphabetically if no day number is present.

  Owner/repo/branch are auto-detected from the Pages URL (owner.github.io/repo/).
  If you use a custom domain or a user site, set them here:
*/
const CONFIG = {
  owner:  null,   // e.g. "yourname"
  repo:   null,   // e.g. "bumfodder"
  branch: null,   // e.g. "main"  (null = repo default branch)
  basePath: ""    // folder inside the repo that holds the war folders ("" = repo root)
};

const $status = document.getElementById('status');
const $wars   = document.getElementById('wars');

function detectRepo(){
  let {owner, repo} = CONFIG;
  const host = location.hostname;
  if(!owner && host.endsWith('.github.io')) owner = host.split('.')[0];
  if(!repo){
    const seg = location.pathname.split('/').filter(Boolean)[0];
    if(seg && !/\.html?$/i.test(seg)) repo = seg;
    else if(owner) repo = owner + '.github.io';   // user/org site
  }
  return {owner, repo};
}

function dayOf(name){
  const m = name.match(/day[-_ ]?(\d+)/i);
  return m ? parseInt(m[1],10) : -1;
}
function warOf(folder){
  const m = folder.match(/(\d+)/);
  return m ? parseInt(m[1],10) : -1;
}
function cmpFiles(a,b){            // ascending
  return dayOf(a.name)-dayOf(b.name) || a.name.localeCompare(b.name,undefined,{numeric:true});
}
const enc = p => p.split('/').map(encodeURIComponent).join('/');

async function getTree(){
  const {owner, repo} = detectRepo();
  if(!owner || !repo) throw new Error('Could not detect GitHub repo. Set CONFIG.owner and CONFIG.repo in index.htm.');
  let branch = CONFIG.branch;
  if(!branch){
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
    if(!r.ok) throw new Error('GitHub API error '+r.status);
    branch = (await r.json()).default_branch;
  }
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
  if(!r.ok) throw new Error('GitHub API error '+r.status+(r.status===403?' (rate limit – try again later)':''));
  const j = await r.json();
  return j.tree.filter(t=>t.type==='blob').map(t=>t.path);
}

// Optional offline/local fallback: a manifest.json listing paths, e.g. ["W142/a.png", ...]
async function getManifest(){
  const r = await fetch('manifest.json',{cache:'no-store'});
  if(!r.ok) throw new Error('no manifest');
  return r.json();
}

function group(paths){
  const base = CONFIG.basePath ? CONFIG.basePath.replace(/^\/|\/$/g,'')+'/' : '';
  const wars = {};
  for(const p of paths){
    if(!p.startsWith(base) || !/\.png$/i.test(p)) continue;
    const rel = p.slice(base.length).split('/');
    if(rel.length !== 2) continue;           // only <war>/<file>.png
    (wars[rel[0]] ||= []).push({name:rel[1], path:p});
  }
  return Object.entries(wars)
    .map(([war,files])=>({war, files:files.sort(cmpFiles)}))
    .sort((a,b)=>warOf(b.war)-warOf(a.war) || b.war.localeCompare(a.war,undefined,{numeric:true}));
}

function render(list){
  if(!list.length){ $status.textContent='No PNG files found in war folders.'; return; }
  $status.remove();
  list.forEach((w,i)=>{
    const latest = w.files[w.files.length-1];
    const d = dayOf(latest.name);
    const sec = document.createElement('section');
    sec.className = 'war' + (i===0?' latest':'');
    const older = w.files.slice(0,-1).reverse();
    sec.innerHTML = `
      <h2><span>War ${warOf(w.war)>=0?warOf(w.war):w.war}</span>
          <span class="tag">${i===0?'Latest war · ':''}${w.files.length} image${w.files.length>1?'s':''}</span></h2>
      <a class="shot" href="${enc(latest.path)}" target="_blank" rel="noopener">
        <img src="${enc(latest.path)}" alt="${latest.name}" ${i>0?'loading="lazy"':''}>
      </a>
      <div class="caption">${d>=0?'Day '+d+' · ':''}${latest.name}</div>
      ${older.length?`<details><summary>Earlier images (${older.length})</summary>
        <div class="thumbs">${older.map(f=>`
          <a href="${enc(f.path)}" target="_blank" rel="noopener">
            <img loading="lazy" src="${enc(f.path)}" alt="${f.name}">
            ${dayOf(f.name)>=0?'Day '+dayOf(f.name):f.name}
          </a>`).join('')}</div></details>`:''}`;
    $wars.appendChild(sec);
  });
}

(async()=>{
  try{
    let paths;
    try{ paths = await getTree(); }
    catch(e){ paths = await getManifest().catch(()=>{ throw e; }); }
    render(group(paths));
  }catch(e){
    $status.textContent = 'Could not load images: '+e.message;
  }
})();
</script>
</body>
</html>
